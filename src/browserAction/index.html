<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div style="width: 100%">
    <div>
      <label for="translatorSelection">
        Translator
      </label>
        <select id="translatorSelection" name="translatorSelection">
          <option value="linguee">Linguee</option>
          <option value="google" selected>Google Translate</option>
        </select>
    </div>
    <div>
      <label for="translateWithDoubleClick">Übersetze bei Doppelklick</label>
      <input type="checkbox" id="translateWithDoubleClick" name="translateWithDoubleClick" />
    </div>
    </div>
    <div style="width: 100%; padding: 10px 0">
      <button id="reset-list">Reset Words</button>
      <button id="export-list">Export</button>
    </div>
    <hr />
    <table id="word-list">
      <tr>
        <td>Wort</td>
        <td>Anzahl</td>
        <td>Erstmals</td>
        <td>Letztmals</td>
      </tr>
    </table>
    <script type="module" src="popupScript.mjs"></script>
  </body>
</html>
